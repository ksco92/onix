name: check

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only builds and runs the gate, it never
# writes to the repo or posts statuses of its own.
permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - name: Install gate tools
        run: |
          cargo install cargo-llvm-cov --version 0.9.0 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      # Swatinem/rust-cache fingerprints every crate's own sources into its
      # cache key and, by default, only caches dependency-crate build
      # output (not the workspace crates' own target/ artifacts). A
      # hand-rolled `actions/cache` keyed on Cargo.lock alone restores
      # stale workspace-crate artifacts with newer mtimes than the fresh
      # checkout whenever a PR doesn't touch the lockfile, so cargo treats
      # the old build as current and the gate silently tests the wrong code.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: make check
        run: make check
      - name: Export lcov coverage
        run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex 'crates/onix-py/src/'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

name: check

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only builds and runs the gate, it never
# writes to the repo or posts statuses of its own.
permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - name: Install gate tools
        run: |
          cargo install cargo-llvm-cov --version 0.9.0 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: make check
        run: make check
      - name: Export lcov coverage
        run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex 'crates/onix-py/src/'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

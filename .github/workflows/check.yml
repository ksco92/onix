name: check

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only builds and runs the gate, it never
# writes to the repo or posts statuses of its own.
permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - name: Install gate tools
        run: |
          cargo install cargo-llvm-cov --version 0.9.0 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      # Caches dependency crates only; workspace crates rebuild every run.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: make check
        run: make check
      - name: Export lcov coverage
        run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex 'crates/onix-py/src/'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  # Builds the Python extension and runs its pytest suite (the coverage
  # authority for the cdylib, including the Arrow table-diff tests) on both
  # ends of pyproject.toml's `requires-python` range, so a construct that
  # only resolves under one interpreter's deferred annotation evaluation or a
  # newer stdlib feature is caught here instead of shipping broken. Kept on a
  # single platform to bound runtime; the release wheels are built by
  # publish.yml. CONTRIBUTING.md's "Interpreter coverage" section lists which
  # tests stay interpreter-pinned (and skip on 3.9) and why. `.python-version`
  # pins 3.14, so every uv invocation below passes --python explicitly;
  # without it `uv run` silently re-resolves against the pinned version. The
  # bare-venv import step (3.14 only, matching the wheels actually published)
  # proves the wheel installs and imports with no optional (pyarrow) or test
  # dependency present; the import-blocking subprocess test in
  # test_table_diff.py proves diff_tables itself works without pyarrow.
  python-test:
    name: python bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # 3.14 is pinned to Unicode 16.0.0; see tests/golden/README.md, Pinned versions.
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # Caches only dependency crates, never this workspace's own build
      # artifacts, so a stale build can't be served (see issue #51).
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install maturin
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv tool install maturin==1.15.0
      - name: Build the wheel and import it with no optional dependencies
        if: matrix.python-version == '3.14'
        working-directory: crates/onix-py
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          maturin build --release --out dist
          uv venv --python ${{ matrix.python-version }} /tmp/bare
          uv pip install --python /tmp/bare/bin/python dist/*.whl
          /tmp/bare/bin/python -c "import deepdiff_rs; print('imported deepdiff_rs with no optional deps')"
      - name: Run the Python test suite
        working-directory: crates/onix-py
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv sync --group test --python ${{ matrix.python-version }}
          uv run --group test --python ${{ matrix.python-version }} maturin develop --release
          uv run --group test --python ${{ matrix.python-version }} pytest tests --collect-only -q
          uv run --group test --python ${{ matrix.python-version }} pytest tests -q

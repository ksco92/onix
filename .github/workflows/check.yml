name: check

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only builds and runs the gate, it never
# writes to the repo or posts statuses of its own.
permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - name: Install gate tools
        run: |
          cargo install cargo-llvm-cov --version 0.9.0 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      # Caches dependency crates only; workspace crates rebuild every run.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: make check
        run: make check
      - name: Export lcov coverage
        run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex 'crates/onix-py/src/'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  # Builds the Python extension and runs its pytest suite (the coverage
  # authority for the cdylib, including the Arrow table-diff tests). Kept on a
  # single platform to bound runtime; the release wheels are built by
  # publish.yml. The `maturin build` step first proves the wheel builds with
  # the optional `arrow` extra (pyarrow) absent, before the test group installs
  # pyarrow/polars/duckdb.
  python-test:
    name: python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-python-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the wheel and run the Python suite
        working-directory: crates/onix-py
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          uv python install 3.12
          uv tool install maturin
          # The wheel must build with no optional (pyarrow) or test deps present.
          maturin build --release --out dist
          # Then the full suite, which installs pyarrow/polars/duckdb (test group).
          uv sync --group test
          uv run --group test maturin develop --release
          uv run --group test pytest tests -q

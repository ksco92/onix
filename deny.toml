[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # target-lexicon (pyo3 build)
    "Apache-2.0 WITH LLVM-exception",
    # unicode-ident
    "Unicode-3.0",
    # numpy via pyo3-arrow
    "BSD-2-Clause",
    # tiny-keccak, compile-time only
    "CC0-1.0",
]

[bans]
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

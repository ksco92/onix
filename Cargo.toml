[workspace]
resolver = "3"
members = ["crates/onix-core", "crates/onix-cli", "crates/onix-py"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

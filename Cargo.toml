[workspace]
resolver = "3"
members = ["crates/onix-core", "crates/onix-cli", "crates/onix-py", "crates/onix-arrow"]

[workspace.package]
version = "0.6.2"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

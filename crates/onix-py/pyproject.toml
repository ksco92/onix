[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "deepdiff-rs"
description = "Rust rewrite of Python DeepDiff's core: byte-compatible deep diffing of JSON, 64-5757x faster, ignore_order included"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Carvajal" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ksco92/onix"
Repository = "https://github.com/ksco92/onix"

[dependency-groups]
# Test-only dependencies (never shipped in the wheel): pytest to run
# crates/onix-py/tests/, and real deepdiff pinned to the exact version the
# whole repo's golden corpus is generated against (see
# ../../tests/golden/README.md) — parity is only meaningful against one
# fixed incumbent version.
#
# `deepdiff==9.1.0` itself requires Python >=3.10, tighter than this
# package's own `requires-python` (>=3.9) — the marker below keeps `uv
# sync`'s universal (all-supported-versions) resolution satisfiable; the
# test suite is only ever actually run under the pinned 3.13 interpreter
# (see README.md's "Python" section), which the marker allows.
test = ["pytest>=8", "deepdiff==9.1.0 ; python_version >= '3.10'"]

[tool.maturin]
bindings = "pyo3"
module-name = "deepdiff_rs"
features = ["pyo3/extension-module"]

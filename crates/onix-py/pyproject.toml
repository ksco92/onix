[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "deepdiff-rs"
description = "onix is a Rust rewrite of Python DeepDiff's core: byte-compatible output, 37-4245x faster, with ignore_order support included."
readme = "../../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Carvajal" }]
keywords = ["diff", "deepdiff", "json", "rust", "performance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.optional-dependencies]
# The `arrow` extra pulls in pyarrow, needed only for TableDiff.to_pyarrow()
# and for passing pyarrow objects to diff_tables(). Importing deepdiff_rs and
# diffing polars/DuckDB tables need none of it: those libraries expose the
# Arrow PyCapsule interface themselves. Install with
# `pip install deepdiff-rs[arrow]`.
arrow = ["pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/ksco92/onix"
Repository = "https://github.com/ksco92/onix"

[dependency-groups]
# Test-only dependencies (never shipped in the wheel): pytest to run
# crates/onix-py/tests/, and real deepdiff pinned to the exact version the
# whole repo's golden corpus is generated against (see
# ../../tests/golden/README.md) — parity is only meaningful against one
# fixed incumbent version.
#
# `deepdiff==9.1.0` itself requires Python >=3.10, tighter than this
# package's own `requires-python` (>=3.9) — the marker below keeps `uv
# sync`'s universal (all-supported-versions) resolution satisfiable. There
# is no interpreter pin for the test venv itself (unlike the PEP-723
# scripts under ../../scripts/ and ../../perf/, which do pin an exact
# version): `uv sync` resolves whatever Python >=3.10 it finds/manages, and
# the abi3 wheel this crate builds works identically across all of them.
# polars and duckdb are here (test group) only, never as runtime deps: the
# Arrow table-diff tests feed the same data through pyarrow, polars, and
# DuckDB and assert identical results, which needs all three installed to run
# but none of them installed to use diff_tables. pyarrow is both the `arrow`
# extra and a test dependency (the tests exercise to_pyarrow() and pyarrow
# inputs).
test = [
    "pytest>=8",
    "deepdiff==9.1.0 ; python_version >= '3.10'",
    "pyarrow>=14",
    "polars>=1",
    "duckdb>=1",
]

[tool.pytest.ini_options]
# `scripts/golden_tags.py` (repo root) defines the golden corpus's tagged
# encoding for values JSON cannot express; tests/test_golden_parity.py decodes
# fixtures with it rather than keeping a second copy of the same rule.
pythonpath = ["../../scripts"]

[tool.maturin]
bindings = "pyo3"
module-name = "deepdiff_rs"
features = ["pyo3/extension-module"]

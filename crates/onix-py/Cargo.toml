[package]
name = "onix-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Python bindings (PyO3) for the onix diff engine"

[lib]
name = "deepdiff_rs"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
onix-core = { path = "../onix-core" }
onix-arrow = { path = "../onix-arrow" }
# Same exact Arrow pin as onix-arrow and pyo3-arrow.
arrow-array = "=59.3.0"
arrow-schema = "=59.3.0"
# Each one-shot imported Python Arrow stream is spooled through
# `onix_arrow::spool` so the row diff can re-read it.
# Arrow C Data Interface bridge, keeping this crate `unsafe`-free; arrow ^59.
# `buffer_protocol` needs the non-abi3 buffer API, so it stays off under abi3-py39.
pyo3-arrow = { version = "0.19", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
serde_json = "1"
# Arbitrary-precision integers crossing the Python boundary; the same 0.5 line
# arrow-buffer already resolves in this workspace, so no second copy enters.
num-bigint = "0.5"

# Off by default so `cargo test` links libpython; maturin enables it via
# `pyproject.toml`.
[features]
extension-module = ["pyo3/extension-module"]

[package]
name = "onix-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Python bindings (PyO3) for the onix diff engine"

[lib]
name = "deepdiff_rs"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
onix-core = { path = "../onix-core" }
onix-arrow = { path = "../onix-arrow" }
# Same exact Arrow pin as onix-arrow and the version pyo3-arrow resolves to,
# so the record batches crossing between all three are the identical types.
arrow-array = "=59.3.0"
arrow-schema = "=59.3.0"
# The Arrow C Data Interface bridge: imports any Python object implementing
# the Arrow PyCapsule protocol (__arrow_c_stream__ / __arrow_c_array__) into
# native Arrow record batches with zero copy, and exports batches back the
# same way. Its `unsafe` FFI lives inside the crate, keeping this crate free
# of `unsafe` under the workspace `forbid`. Requires arrow ^59, matching
# onix-arrow's exact 59.3.0 pin, so both see the identical Arrow types.
#
# `default-features = false` turns off only pyo3-arrow's `buffer_protocol`
# feature, which needs the non-abi3 CPython buffer API (`Py_buffer`,
# `releasebufferproc`, gated to Py_3_11+) and so will not compile under this
# crate's abi3-py39; the feature is unused here (only schema import/export and
# the capsule protocol are needed). It does NOT drop pyo3-arrow's own
# dependencies: numpy, ndarray, and matrixmultiply are still pulled in and
# compiled, which is the bulk of the wheel-size increase this bridge brings.
pyo3-arrow = { version = "0.19", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
serde_json = "1"

# `pyo3/extension-module` tells pyo3 not to link against libpython directly
# (the assumption is that the Python interpreter loading this shared library
# already has those symbols in-process) — correct for a wheel built and
# loaded by `maturin`/`pip`, but it breaks a plain `cargo build`/`cargo test`
# invocation (no Python process is loading the resulting binary, so the
# unresolved symbols fail to link). Keeping it out of the default feature
# set lets `cargo build`/`cargo test --workspace` link normally against the
# interpreter's own libpython; maturin enables it explicitly at wheel-build
# time via this crate's `pyproject.toml` (`[tool.maturin] features =
# ["pyo3/extension-module"]`).
[features]
extension-module = ["pyo3/extension-module"]

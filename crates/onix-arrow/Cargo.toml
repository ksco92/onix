[package]
name = "onix-arrow"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Arrow table diffing (schema and keyed rows) built on the onix diff engine"

[lints]
workspace = true

[features]
# Compiles in the per-pass wall-time and peak-RSS instrumentation the
# `row_diff_profile` example reads. Off by default and never enabled by the
# release wheel, so the instrumentation is absent from the shipped `.so`.
profile = []

[dependencies]
# Exact pin shared with onix-py and pyo3-arrow (^59), so record batches crossing the FFI boundary are the same Rust types.
arrow-schema = "=59.3.0"
arrow-array = "=59.3.0"
# `i256` for hashing `Decimal256` cells the same way as `Decimal128`.
arrow-buffer = "=59.3.0"
# Dictionary decode, key casts, cell rendering.
arrow-cast = "=59.3.0"
# Filter, concat, take.
arrow-select = "=59.3.0"
# The anonymous spool.
arrow-ipc = "=59.3.0"
# `arrow-ord`'s null-aware `distinct` kernel finds a partition's changed cells one
# column at a time in the parallel cell pass.
arrow-ord = "=59.3.0"
tempfile = "3"
# Row identity is a keyed 128-bit SipHash-1-3 (`siphasher`), keyed from 16
# bytes of OS randomness per diff (`getrandom`), so the row-matching table on
# this default path cannot be forced into collisions by chosen input.
siphasher = "1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
# `half::f16` builds a Float16 test column; the same version arrow-array uses.
half = "2"

# The profiling harness reads the per-pass instrumentation, so it only builds
# with the `profile` feature (and never as part of the default build or wheel).
[[example]]
name = "row_diff_profile"
required-features = ["profile"]

[[test]]
name = "profile_passes"
required-features = ["profile"]
